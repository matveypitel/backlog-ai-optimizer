server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Logging ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        image/svg+xml;
    gzip_min_length 1024;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin" always;

    # ── API reverse proxy ────────────────────────────────────────────────────
    # Forwards /api/* to the .NET API container.
    # The browser and the API share the same origin → no CORS required.
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Long timeout for scraping & analysis endpoints
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Disable buffering for streaming responses
        proxy_buffering off;
    }

    # ── Immutable static assets (hashed filenames) ───────────────────────────
    location ~* /_app/immutable/ {
        expires max;
        add_header Cache-Control "public, immutable";
    }

    # ── SvelteKit SPA fallback ───────────────────────────────────────────────
    # All non-file requests fall through to index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
